name: Publish

# The tag is a trigger, not a version: each workspace package carries its
# own version in its own package.json (see Changesets), so pushing one tag
# no longer maps to "the" release being cut. The tag's own message is the
# release's record of intent instead — see RELEASING.md for how to write
# one — and `scripts/release-plan.mjs` below holds it to that before
# anything is built or published.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    name: Build & Publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      packages: write
      # The two scopes the attest steps below need, held by this one job.
      id-token: write
      attestations: write
    # Observed 0.37-0.5min over the last 7 successful runs (p95 0.5min) --
    # small sample, this job only fires on a signed release tag.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A lightweight tag can carry a merge commit's GitHub-verified web-flow
      # signature without the tag itself ever being signed by anyone — GitHub
      # checks the commit's signature, not the tag object's. Reading the tag
      # object's own verification status from the API is the only way to tell
      # the two apart, so it runs first, before anything is built against it.
      - name: Assert the tag is annotated and signed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" -q '.object.type')
          if [ "$type" != "tag" ]; then
            echo "::error::$TAG is a lightweight tag. RELEASING.md requires a signed annotated tag (git tag -s)."
            exit 1
          fi

          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" -q '.object.sha')
          verified=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" -q '.verification.verified')
          if [ "$verified" != "true" ]; then
            reason=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" -q '.verification.reason')
            echo "::error::$TAG's own signature did not verify ($reason)."
            exit 1
          fi

      # This workflow triggers on the tag push, a separate event from the `ci`
      # run against the same commit on main, so there's no job to `needs:`
      # across them — the only link is the commit SHA, queried here directly.
      # Matched by job name rather than the workflow run's overall conclusion,
      # so an unrelated Storybook deploy failure can't block a publish that CI
      # itself passed. Fails fast rather than waiting: the release flow tags
      # only after watching CI go green on main, so by the time a tag lands
      # here the run should already be complete — if it isn't, re-running this
      # job after CI finishes is cheaper than a runner sitting in a poll loop.
      - name: Require a green CI run for the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          result=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs" \
            -q '[.check_runs[] | select(.name == "Lint, Format & Test")] | sort_by(.id) | last
                | [(.status // "missing"), (.conclusion // "missing")] | @tsv')
          status=$(printf '%s' "$result" | cut -f1)
          conclusion=$(printf '%s' "$result" | cut -f2)
          if [ "$status" = "missing" ]; then
            echo "::error::No CI run found for $SHA."
            exit 1
          fi
          if [ "$status" != "completed" ]; then
            echo "::error::CI for $SHA is still $status. Wait for it to finish, then re-run this job."
            exit 1
          fi
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI for $SHA did not pass (conclusion: $conclusion)."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@branchleft'

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fails fast, before any build, if the tag's own `name@version` lines
      # don't exactly match the set of workspace packages the registry says
      # aren't published yet — see scripts/release-plan.mjs. Writes that
      # release plan to this run's job summary, and its package names (comma
      # separated, empty when there's nothing to publish) to this step's own
      # `packages` output — the one thing the publish step below is allowed
      # to publish.
      - name: Verify the tag's release plan against the registry
        id: plan
        run: pnpm release-plan
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Always builds every workspace package, in dependency order, even one
      # this run isn't about to publish — a brand package's own build needs
      # `@branchleft/components`'s `dist/` to exist, and that's true whether
      # or not `@branchleft/components` itself is being published this time.
      - name: Build every workspace package
        run: pnpm -r build

      # Publishing recomputes, from the registry, its own opinion of what's
      # unpublished — a second decision that could in principle disagree with
      # the plan step above (a registry write between the two steps, for one).
      # Packing one `--filter <name>` per package the plan approved binds the
      # two: only what release-plan already checked against the tag is packed,
      # so only that can be attested and published, never a wider set pnpm's
      # own lookup happens to pick. Each tarball goes in its own directory
      # named for the package, so the steps below find exactly the file packed.
      - name: Pack exactly the checked release plan
        id: pack
        if: steps.plan.outputs.packages != ''
        run: |
          set -euo pipefail
          IFS=',' read -ra names <<< "$PLAN_PACKAGES"
          for name in "${names[@]}"; do
            short="${name#@branchleft/}"
            case "$short" in
              components | brand-branchleft | brand-publicpress) ;;
              *)
                echo "::error::$name is in the release plan but has no attest step below. Add one before it can be published."
                exit 1
                ;;
            esac
            dir="$RUNNER_TEMP/tarballs/$short"
            mkdir -p "$dir"
            pnpm --filter "$name" pack --pack-destination "$dir"
            files=("$dir"/*.tgz)
            if [ "${#files[@]}" -ne 1 ] || [ ! -f "${files[0]}" ]; then
              echo "::error::Expected exactly one tarball for $name in $dir."
              exit 1
            fi
            echo "$short=${files[0]}" >> "$GITHUB_OUTPUT"
          done
        env:
          PLAN_PACKAGES: ${{ steps.plan.outputs.packages }}

      # One attest step per publishable package, each on the tarball packed
      # above and published unchanged below. The expected identity is a
      # literal: the repository, this workflow file, and the tag that
      # triggered the run. The tag is a release-train counter, not a package
      # version (see the note at the top), so it cannot be derived from the
      # version being published. A failed step fails the job, so the publish
      # step never runs for a tarball that was not attested.
      - name: Attest @branchleft/components
        id: attest_components
        if: steps.pack.outputs.components != ''
        uses: branchLeft/github-workflows/.github/actions/attest-npm-tarball@a2175a416b57f950fed891837f88f2d1a31e00f4 # v1.2.0
        with:
          tarball: ${{ steps.pack.outputs.components }}
          repo: branchLeft/components
          signer-workflow: branchLeft/components/.github/workflows/publish.yml
          ref: ${{ github.ref }}

      - name: Attest @branchleft/brand-branchleft
        id: attest_brand_branchleft
        if: steps.pack.outputs.brand-branchleft != ''
        uses: branchLeft/github-workflows/.github/actions/attest-npm-tarball@a2175a416b57f950fed891837f88f2d1a31e00f4 # v1.2.0
        with:
          tarball: ${{ steps.pack.outputs.brand-branchleft }}
          repo: branchLeft/components
          signer-workflow: branchLeft/components/.github/workflows/publish.yml
          ref: ${{ github.ref }}

      - name: Attest @branchleft/brand-publicpress
        id: attest_brand_publicpress
        if: steps.pack.outputs.brand-publicpress != ''
        uses: branchLeft/github-workflows/.github/actions/attest-npm-tarball@a2175a416b57f950fed891837f88f2d1a31e00f4 # v1.2.0
        with:
          tarball: ${{ steps.pack.outputs.brand-publicpress }}
          repo: branchLeft/components
          signer-workflow: branchLeft/components/.github/workflows/publish.yml
          ref: ${{ github.ref }}

      # Publishes the packed tarballs, components first (the brand packages
      # build against it), and only one whose attest step succeeded. When the
      # plan is empty, this step is skipped — the job still succeeds, and
      # release-plan.mjs already wrote the "nothing to publish" line to the
      # job summary above.
      - name: Publish exactly the checked release plan
        if: steps.plan.outputs.packages != ''
        run: |
          set -euo pipefail
          for short in components brand-branchleft brand-publicpress; do
            files=("$RUNNER_TEMP/tarballs/$short"/*.tgz)
            tarball="${files[0]}"
            [ -f "$tarball" ] || continue
            case "$short" in
              components) outcome="$ATTEST_COMPONENTS" ;;
              brand-branchleft) outcome="$ATTEST_BRAND_BRANCHLEFT" ;;
              brand-publicpress) outcome="$ATTEST_BRAND_PUBLICPRESS" ;;
            esac
            if [ "$outcome" != "success" ]; then
              echo "::error::$short was packed but its attestation did not succeed ($outcome). Not publishing it."
              exit 1
            fi
            pnpm publish "$tarball" --no-git-checks
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATTEST_COMPONENTS: ${{ steps.attest_components.outcome }}
          ATTEST_BRAND_BRANCHLEFT: ${{ steps.attest_brand_branchleft.outcome }}
          ATTEST_BRAND_PUBLICPRESS: ${{ steps.attest_brand_publicpress.outcome }}
