name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# `packages: read` is what lets pnpm fetch @branchleft/tsconfig and
# @branchleft/prettier-config. The registry rejects anonymous requests even for
# a public package, so the run's own GITHUB_TOKEN is passed as NODE_AUTH_TOKEN
# below.
permissions:
  contents: read
  packages: read

jobs:
  ci:
    name: Lint, Format & Test
    runs-on: ubuntu-latest
    # Observed 172-251s (median 199s) over the 12 successful runs since the
    # Storybook accessibility check visits pages four at a time. The Playwright
    # install is inside the setup composite, which takes no step timeout, so the job
    # timeout is its bound. Each apt and browser attempt is capped at 50s.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Playwright's system dependencies and Chromium are installed with the
      # dependencies, so the Storybook accessibility check below has its browser.
      - name: Setup pnpm, Node and dependencies
        uses: ./.github/actions/setup-pnpm-node
        with:
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
          playwright: 'true'

      - name: Setup Python (for pre-commit)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      # Re-runs the same hooks .pre-commit-config.yaml defines, so a commit
      # made with --no-verify is still caught here. This is the sole format
      # and lint check now — the local prettier/eslint hooks run the same
      # `pnpm format`/`pnpm lint` scripts pre-commit would invoke anyway (only
      # --write/--fix vs. --check, same file scope), so separate steps for
      # those would just duplicate this one. Vitest is skipped: the dedicated
      # step below already covers it.
      - name: Run pre-commit hooks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        env:
          SKIP: vitest

      - name: Type check
        run: pnpm type-check

      - name: Unit tests
        run: pnpm test:unit
        env:
          CI: true

      - name: Test the release-plan script
        run: pnpm test:scripts
        env:
          CI: true

      - name: Build
        run: pnpm build

      - name: Build Storybook
        run: pnpm build:storybook

      # Runs in the same fast job (not the separate GitHub Pages deploy job,
      # which only runs on `main`) so a PR that regresses a story's contrast
      # or breaks a PublicPress story's load fails CI before merge, not after
      # a deploy.
      - name: Storybook accessibility check
        run: node scripts/storybook-a11y-check.mjs

  verify-package-attestations:
    name: Verify package attestations
    runs-on: ubuntu-latest
    # The run's own token reads the private registry (`packages: read`), as the
    # install steps above do. Nothing here writes or needs a secret.
    permissions:
      contents: read
      packages: read
    # Unobserved: no run of this job exists yet. The first run sets the number.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify locked @branchleft packages
        uses: branchLeft/github-workflows/.github/actions/verify-package-attestations@b1092eafc16f34551fd2fd99328966beceb565e0 # v1.2.5

  deploy-storybook:
    name: Deploy Storybook to GitHub Pages
    runs-on: ubuntu-latest
    needs: [ci]
    if: github.ref == 'refs/heads/main'
    # Job-level permissions replace the workflow-level block entirely, so
    # `packages: read` is restated alongside the scopes actually being added.
    permissions:
      contents: read
      packages: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Observed 0.65-0.77min over the last 10 successful runs (p95 0.77min).
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm, Node and dependencies
        uses: ./.github/actions/setup-pnpm-node
        with:
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Storybook
        run: pnpm build:storybook

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: storybook-static/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
